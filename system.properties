# JMeter System Properties (JVM-level)
# Loaded via: jmeter -S system.properties

# DNS caching (seconds) - 0 disables caching
networkaddress.cache.ttl=0
networkaddress.cache.negative.ttl=0

# SSL/TLS Configuration
https.protocols=TLSv1.2,TLSv1.3

# JVM Memory (can also be set via JVM_ARGS env variable)
# Example: JVM_ARGS="-Xms512m -Xmx2048m" jmeter ...
